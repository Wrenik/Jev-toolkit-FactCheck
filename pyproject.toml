[project]
name = "jev-toolkit-factcheck"
version = "0.1.0"
description = "Fact checker with hover evidence: LLM-cited verbatim quotes are located in the fetched source (offsets), a judgement model (currently TypeSafe Jev) rates support, everything is traceable in a static HTML report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Ährlund" }]
requires-python = ">=3.11"
dependencies = [
    "jev-toolkit-usage @ git+https://github.com/Wrenik/Jev-toolkit-usage.git",
]

[project.optional-dependencies]
# Optional: the injection scanner adds its offline layers 1-2 to the passage check. Without it the
# built-in rules in jev_factcheck.guard are used on their own.
scanner = ["jev-toolkit-scanner @ git+https://github.com/Wrenik/Jev-toolkit-Scanner.git"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "pypdf>=4", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_factcheck = ["data/*.toml", "data/*.json", "evalset/*.json", "evalset/pages/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (costs a fraction of a cent; needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"

[project.urls]
Homepage = "https://github.com/Wrenik/Jev-toolkit-FactCheck"
Issues = "https://github.com/Wrenik/Jev-toolkit-FactCheck/issues"
Changelog = "https://github.com/Wrenik/Jev-toolkit-FactCheck/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: long docstring/comment lines are fine here; B023: closures are called immediately; UP007: Union aliases are kept explicit;
# B008/B905: default-argument calls and zip() without strict are used on purpose.
ignore = ["E501", "B023", "UP007", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
